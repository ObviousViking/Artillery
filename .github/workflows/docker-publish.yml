name: Build and Push to Docker Hub

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch: {}

jobs:
  # Computes the next release version as year.month.build (e.g. 2026.8.1),
  # where "build" resets to 1 at the start of each month. Read-only — just
  # inspects existing tags; the tag itself is only actually created once
  # `release` confirms `build` succeeded.
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: compute
        run: |
          YEAR_MONTH=$(date -u +'%Y.%-m')
          ESCAPED=$(printf '%s' "$YEAR_MONTH" | sed 's/\./\\./g')
          LAST=$(git tag --list "${YEAR_MONTH}.*" | sed -E "s/^${ESCAPED}\.//" | sort -n | tail -1)
          NEXT=$(( ${LAST:-0} + 1 ))
          VERSION="${YEAR_MONTH}.${NEXT}"
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Runs on dev/manual pushes too (where `version` is deliberately
    # skipped, not failed) — only actually skips if `version` itself fails.
    # `always()` is required here: GitHub Actions applies an implicit "all
    # needed jobs must succeed" gate on top of ANY custom `if:`, even one
    # that already accounts for a skip — without always() that gate skips
    # this job outright whenever `version` was skipped, before this
    # condition is even evaluated.
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── This creates a proper Buildx builder with docker-container driver ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            obviousviking/artillery
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only on main, and only once version/build have both actually succeeded
  # (not just "not failed" — this condition replaces the default implicit
  # success() check, so it's spelled out explicitly here).
  release:
    needs: [version, build]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
